name: CI/CD - Expo TMDB App

on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 24]

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
  uses: actions/setup-node@v4
  with:
    node-version: ${{ matrix.node-version }}
    cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes
        run: npm test -- --watchAll=false --passWithNoTests

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Criar arquivo .env para Expo
        run: echo "EXPO_PUBLIC_TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}" > .env

      - name: Exportar versão web
        run: npx expo export --platform web

      - name: Desativar Jekyll no GitHub Pages
        run: touch dist/.nojekyll

      - name: Upload do artefato do GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          #          include-hidden-files: true

  deploy-web:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: build-web

    if: github.ref == 'refs/heads/release'

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm ci

      - name: Criar arquivo .env para Expo
        run: echo "EXPO_PUBLIC_TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}" > .env

      - name: Gerar projeto Android com Expo Prebuild
        run: npx expo prebuild --platform android --non-interactive

      - name: Dar permissão ao Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Gerar APK Release
        run: |
          cd android
          ./gradlew assembleRelease

      - name: Copiar APK para raiz
        run: cp android/app/build/outputs/apk/release/app-release.apk app-release.apk

      - name: Upload do APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app-release.apk

  release:
    name: Criar GitHub Release
    runs-on: ubuntu-latest
    needs:
      - deploy-web
      - build-android

    if: github.ref == 'refs/heads/release'

    permissions:
      contents: write

    steps:
      - name: Baixar APK
        uses: actions/download-artifact@v4
        with:
          name: app-release-apk
          path: release

      - name: Criar Release com APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          body: |
            Release automática gerada pelo GitHub Actions.

            Inclui:
            - Deploy web no GitHub Pages
            - APK Android gerado automaticamente
          files: release/app-release.apk
